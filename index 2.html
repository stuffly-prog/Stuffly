<div class="row"><input id="rtn" type="time" value="${rt}" style="width:130px"><button class="p" data-a="rda">${t('add')}</button></div><div class="row">${[0,1,2,3,4,5,6].map(i=>`<button class="${rd.includes(i)?'p':''}" data-a="rday" data-v="${i}" style="padding:6px 8px;min-height:36px">${dn(i)}</button>`).join('')}</div><p class="mu">${t('nnote')}</p>
<div class="row"><button data-a="edit">✎ ${t('edit')}</button><button data-a="dup">${t('dup')}</button><button data-a="pz">${h.paused?t('hr'):t('hp')}</button><button data-a="ar">${h.arch?t('unarch'):t('arch')}</button><button data-a="mv" data-v="-1">↑</button><button data-a="mv" data-v="1">↓</button><button data-a="delh" style="color:#f66">${t('del')}</button></div>`}
function sheet(){let b='';
 if(m.t==='a')b=`<h2>+</h2><button class="p big" data-a="lib">${t('addh')}</button><button class="big" data-a="new">${t('cust')}</button>`;
 else if(m.t==='l')b=`<div class="h"><h2>${t('addh')}</h2><button data-a="close">✕</button></div><input id="lq" placeholder="${t('search')}" value="${esc(lq)}"><div class="row">${[['',t('all')],...D.cats.map(c=>[c.id,cn(c.id)])].map(c=>`<button class="${lc===c[0]?'p':''}" data-a="lcat" data-v="${c[0]}">${esc(c[1])}</button>`).join('')}</div><div id="ll">${lib()}</div>`;
 else if(m.t==='f')b=form();
 else if(m.t==='d'){const h=hb(m.id);b=h?det(h):''}
 else if(m.t==='c')b=`<p>${t('sure')}</p><div class="row"><button class="p" data-a="yes">${t('yes')}</button><button data-a="close">${t('no')}</button></div>`;
 else if(m.t==='x')b=`<div class="h"><h2>${t('data')}</h2><button data-a="close">✕</button></div><textarea id="dj" rows="10">${esc(JSON.stringify(D))}</textarea><div class="row"><button data-a="copy">${t('copy')}</button><button class="p" data-a="imp">${t('imp')}</button><input id="lf" type="file" accept=".json,application/json"></div>`;
 return `<div class="sheet"><div class="bk" data-a="close"></div><div class="pn">${b}</div></div>`}
function render(){try{const r=document.documentElement;r.dir=lang()==='ar'?'rtl':'ltr';r.lang=lang();r.dataset.theme=D.set.theme;
 const y=window.scrollY,ae=document.activeElement&&document.activeElement.id;
 $('#app').innerHTML=pg==='h'?home():pg==='s'?stats():pg==='c'?calp():setp();
 $('#nav').innerHTML=[['h','🏠','home'],['s','📊','stats'],['+'],['c','📅','cal'],['t','⚙️','set']].map(x=>x[0]==='+'?`<button class="add" data-a="add" aria-label="${t('addh')}">+</button>`:`<button class="${pg===x[0]?'on':''}" data-pg="${x[0]}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[x[0]]}</svg>${t(x[2])}</button>`).join('');
 $('#sheet').innerHTML=m?sheet():'';document.body.style.overflow=m?'hidden':'';pop=''}catch(e){console.error(e);$('#app').textContent=t('err')+': '+e.message}}
setInterval(()=>{const n=new Date();if(K(n)!==td){if(cur===td)cur=K(n);td=K(n);render()}
 const hm=pad(n.getHours())+':'+pad(n.getMinutes());
 if(hm!==lm){lm=hm;D.habits.forEach(h=>{if(h.paused||h.arch)return;h.rm.forEach(r=>{if(r.on&&r.t===hm&&r.d.includes(n.getDay())){toast('⏰ '+nm(h));try{if(typeof Notification!=='undefined'&&Notification.permission==='granted')new Notification('Stuffly',{body:nm(h)})}catch(e){}}})})}
 if(m&&m.t==='d'){const h=hb(m.id),e=$('#tm');if(h&&e)e.textContent=tmt(h)}
 Object.keys(D.timers).forEach(id=>{const h=hb(id),x=D.timers[id];if(!h)delete D.timers[id];else if(x.s&&h.m==='countdown'&&el(id)>=cd(h)){tm(h,'stop');toast('⏰ '+nm(h))}})},1000);
window.addEventListener('error',()=>toast(t('err')));
const acc=()=>`<h3>${t('acct')}</h3>`+(!sb?`<p class="mu">${t('notcfg')}</p>`:user?`<p>${esc(user.email)}</p><div class="row"><button class="p" data-a="syncnow">${t('syncnow')}</button><button data-a="signout">${t('signout')}</button></div>`:`<p class="mu">${t('acctnote')}</p><input id="em" type="email" placeholder="${t('email')}" autocomplete="email"><input id="pw" type="password" placeholder="${t('pass')}" autocomplete="current-password" style="margin-top:8px"><div class="row"><button class="p" data-a="signin">${t('signin')}</button><button data-a="signup">${t('signup')}</button></div>`);
function push(){if(!sb||!user)return;clearTimeout(pt);pt=setTimeout(async()=>{const r=await sb.from('user_data').upsert({user_id:user.id,data:D,updated_at:new Date(D.upd||Date.now()).toISOString()});if(r.error)toast(t('err'))},1500)}
async function pull(){const r=await sb.from('user_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();if(r.error)return toast(t('err'));
 const d=r.data,rem=d?new Date(d.updated_at).getTime():0;
 if(d&&d.data&&Array.isArray(d.data.habits)&&(rem>(D.upd||0)||(!D.habits.length&&d.data.habits.length))){D=Object.assign(fresh(),d.data);D.upd=rem;try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}toast(t('synced'))}else push();
 render()}
if(sb){sb.auth.getSession().then(x=>{user=x.data.session?x.data.session.user:null;if(user)pull();render()});
 sb.auth.onAuthStateChange((_e,x)=>{const u=x?x.user:null;if((u&&u.id)!==(user&&user.id)){user=u||null;if(user)pull();render()}})}
render();
</script></body></html>
